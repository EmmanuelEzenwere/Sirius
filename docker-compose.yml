# Local observability stack: the API plus Prometheus and Grafana, with the
# datasource and dashboard provisioned at startup so `docker compose up --build`
# is the entire setup. This is the runnable version of the service-health layer
# described in README, "Monitoring".
#
# Not a production topology. Prometheus and Grafana run as single unauthenticated
# containers here; in a real deployment they are managed services (see the
# Deployment table in the README) and the app is the only thing that ships.

name: sirius

services:
  app:
    build: .
    image: sirius:local
    container_name: sirius-app
    ports:
      - "8888:8888"
    environment:
      # In a real deploy this is set by the pipeline to the artifact version.
      MODEL_VERSION: ${MODEL_VERSION:-v0.0.0-local}
    # HEALTHCHECK is inherited from the Dockerfile, which probes /health.
    # Redefining it here would let the two drift apart.
    networks: [sirius]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: sirius-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Allows `curl -X POST localhost:9090/-/reload` after editing the scrape
      # config, instead of restarting the container.
      - --web.enable-lifecycle
    depends_on:
      app:
        # Wait for the model to load and warm rather than just for the process
        # to exist, so the first scrapes are not against a starting container.
        condition: service_healthy
    networks: [sirius]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.6
    container_name: sirius-grafana
    ports:
      - "3000:3000"
    environment:
      # Anonymous viewer access: this is a throwaway local stack and the point
      # is that the dashboard opens with no clicking. admin/admin still works
      # for editing.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Land on the Sirius dashboard instead of the Grafana welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/sirius.json
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Deliberately not under /var/lib/grafana: nesting a read-only bind mount
      # inside the grafana-data volume is fragile.
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [sirius]
    restart: unless-stopped

networks:
  sirius:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
